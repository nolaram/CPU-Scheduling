{% extends "base.html" %}

{% block content %}
<section class="page-title">
  <h1>CPU Scheduling</h1>
  <p>Enter process details and choose the scheduling algorithm.</p>
</section>

<form method="post" id="cpu-form">
  <div class="field-row">
    <label for="algorithm">Algorithm</label>
    <select name="algorithm" id="algorithm" required>
      <option value="1">FCFS</option>
      <option value="2">SJF Non-Preemptive</option>
      <option value="3">SJF Preemptive</option>
      <option value="4">Priority Non-Preemptive</option>
      <option value="5">Priority Preemptive</option>
      <option value="6">Round Robin</option>
    </select>
  </div>

  <div class="field-row" id="quantum-row" style="display:none;">
    <label for="quantum">Time Quantum</label>
    <input type="number" name="quantum" id="quantum" min="1" value="2" />
  </div>

  <section class="process-section">
    <div class="section-header">
      <h2>Processes</h2>
      <button type="button" class="button secondary" id="add-cpu-process">Add Process</button>
    </div>
    <div id="cpu-process-list"></div>
  </section>

  <button type="submit" class="button primary">Run Scheduling</button>
</form>
{% endblock %}
